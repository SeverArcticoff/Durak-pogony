<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091a15"><link rel="manifest" href="/manifest.json"><title>Дурак 2×2 — Погоны</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#244e3c,#091a15 65%);color:#f2e9d5;font:15px system-ui,sans-serif;min-height:100dvh}main{max-width:600px;margin:auto;padding:16px 12px 24px}header{text-align:center;letter-spacing:3px;color:#e6c47e;font-size:12px}h1{font: bold 32px Georgia;margin:7px 0;letter-spacing:1px}button,input{font:inherit;border-radius:12px;padding:12px;border:1px solid #a78a51}button{background:#d6b36e;color:#18251c;font-weight:700;cursor:pointer}button:disabled{opacity:.35}input{background:#132d25;color:white;width:100%;margin:6px 0}button.secondary{background:#233d30;color:#e8d7ae} .panel{background:#10271f;border:1px solid #526b50;border-radius:20px;padding:18px;margin-top:18px}.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.meta{display:flex;justify-content:space-between;font-size:12px;margin:14px 0;color:#d9c89d}.table{position:relative;min-height:340px;border:3px solid #a78a51;border-radius:90px;background:radial-gradient(ellipse,#327a53,#174b37 75%);box-shadow:inset 0 0 0 7px #143e2e,inset 0 0 50px #112f25,0 12px 24px #0005;padding:72px 48px 60px;display:flex;align-items:center;justify-content:center}.player{position:absolute;text-align:center;font-size:11px;max-width:100px;overflow:hidden;color:#efc5a9}.player.friend{color:#a9e7bc}.player.active .avatar{box-shadow:0 0 0 3px #f0cb78,0 0 18px #f0cb78}.avatar{width:34px;height:34px;border:1px solid currentColor;border-radius:50%;background:#142d25;margin:0 auto 3px;display:grid;place-items:center;font-size:17px}.top{top:12px;left:50%;transform:translateX(-50%)}.left{left:9px;top:43%}.right{right:9px;top:43%}.bottom{bottom:9px;left:50%;transform:translateX(-50%)}.cards{display:flex;justify-content:center;flex-wrap:wrap;gap:5px}.card{background:linear-gradient(135deg,#fffef9,#e9e1ce);color:#182026;border:1px solid #b7af9e;border-radius:7px;width:49px;height:70px;position:relative;box-shadow:0 3px 5px #0005;padding:4px;flex-shrink:0;text-align:left;cursor:pointer}.card.red{color:#b62039}.card b{font:700 17px Georgia}.card span{position:absolute;left:0;right:0;top:22px;text-align:center;font-size:30px}.card small{position:absolute;bottom:3px;right:4px;transform:rotate(180deg);font:700 12px Georgia}.card.selected{transform:translateY(-9px);outline:2px solid #eac477}.pair{position:relative;width:64px;height:94px}.pair .card:nth-child(2){position:absolute;left:15px;top:20px;transform:rotate(8deg)}.hand{padding:18px 0 8px;display:flex;justify-content:center;flex-wrap:wrap;gap:4px}.hand .card{width:53px;height:78px}.status{text-align:center;margin:12px 0;min-height:24px;color:#e6cf9a}.error{color:#ffb0a0;min-height:18px;text-align:center;font-size:13px}.result{text-align:center;font: bold 23px Georgia;color:#f1ce87;margin:16px 0}.muted{color:#aebeb1;font-size:12px;text-align:center}.hidden{display:none}#actions button{font-size:13px;padding:10px} .brand{font-size:32px;color:#d5b575}.score{font-size:15px;color:#f0ce8c}</style><main><header><div class="brand">♠ ♦ ♣ ♥</div><h1>ПОГОНЫ</h1>ДУРАК · 2 × 2</header><section id="lobby" class="panel"><h2>Закрытый клуб</h2><p class="muted">Четыре игрока. Две команды. Одна колода.</p><input id="name" maxlength="24" placeholder="Ваше имя"><button id="create" style="width:100%">Создать комнату</button><input id="code" maxlength="6" placeholder="Код комнаты"><button id="join" class="secondary" style="width:100%">Войти в комнату</button></section><section id="game" class="hidden"><div class="meta"><span id="room"></span><span id="score"></span></div><div id="waiting" class="panel hidden"></div><div id="play" class="hidden"><div class="meta"><span id="trump"></span><span id="target"></span></div><div class="table"><div id="players"></div><div id="table" class="cards"></div></div><div class="status" id="status"></div><div id="result" class="result"></div><div id="hand" class="hand"></div><div id="actions" class="row"></div></div><div class="row" style="margin-top:16px"><button id="share" class="secondary">Пригласить</button><button id="leave" class="secondary">Выйти</button></div></section><p class="error" id="error"></p><p class="muted">Приватные комнаты · без регистрации</p></main><script>
const $=id=>document.getElementById(id);let session=JSON.parse(localStorage.getItem('pogony')||'null'),state=null,selected=null,busy=false;const query=new URLSearchParams(location.search);$('code').value=query.get('room')||'';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(route,data){let url='/api/'+route;let opt={};if(data){opt={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...session,...data})}}else url+='?'+new URLSearchParams(session);let r=await fetch(url,opt),j=await r.json();if(!r.ok)throw Error(j.error);return j}function error(e){$('error').textContent=e.message}async function enter(route){try{session=await api(route,{name:$('name').value,code:$('code').value.trim().toUpperCase()});localStorage.setItem('pogony',JSON.stringify(session));await refresh()}catch(e){error(e)}}$('create').onclick=()=>enter('create');$('join').onclick=()=>enter('join');$('leave').onclick=()=>{session=null;state=null;localStorage.removeItem('pogony');location.href='/'};$('share').onclick=async()=>{let url=location.origin+'/?room='+session.code;try{if(navigator.share)await navigator.share({title:'Погоны',url});else{await navigator.clipboard.writeText(url);$('error').textContent='Ссылка скопирована'}}catch(e){$('error').textContent='Код комнаты: '+session.code}};async function refresh(){if(!session||busy)return;try{state=await api('state');render()}catch(e){error(e)}}async function act(type,extra={}){if(busy)return;busy=true;try{state=await api('action',{type,...extra});selected=null;$('error').textContent='';render()}catch(e){error(e)}finally{busy=false}}function card(c,extra=''){let s=c.slice(-1),r=c.slice(0,-1);return `<div class="card ${'♥♦'.includes(s)?'red':''} ${extra}"><b>${r}${s}</b><span>${s}</span><small>${r}${s}</small></div>`}function btn(text,type,disabled=false){let b=document.createElement('button');b.textContent=text;b.disabled=disabled;b.onclick=()=>act(type,type==='attack'?{card:selected}:{});$('actions').append(b)}function render(){let s=state,m=s.me;$('lobby').classList.add('hidden');$('game').classList.remove('hidden');$('room').textContent='Комната '+s.code;$('score').textContent='Победы '+s.wins.join(' : ')+' · Погоны '+s.medals.join(' : ');$('waiting').classList.toggle('hidden',s.phase!=='lobby');$('play').classList.toggle('hidden',s.phase==='lobby');if(s.phase==='lobby'){$('waiting').innerHTML='<h2>Игроки '+s.players.length+'/4</h2>'+s.players.map((p,i)=>'<p>'+esc(p)+' · команда '+(i%2+1)+'</p>').join('');if(m===0){let b=document.createElement('button');b.textContent='Начать игру';b.disabled=s.players.length!==4;b.onclick=()=>act('start');$('waiting').append(b)}return}$('trump').textContent='Козырь '+s.trump+' · Колода '+s.deck;$('target').textContent='Звание: '+s.target;$('players').innerHTML=[0,1,2,3].map((_,i)=>{let j=(m+i)%4;return `<div class="player ${['bottom','left','top','right'][i]} ${i%2===0?'friend':''} ${j===s.attack||j===s.defend?'active':''}"><div class="avatar">${i%2===0?'♛':'♟'}</div>${esc(s.players[j])}<br>${s.counts[j]} карт</div>`}).join('');$('table').innerHTML=s.table.map((p,i)=>`<div class="pair" data-i="${i}">${card(p.a)}${p.b?card(p.b):''}</div>`).join('')||'<span class="muted">♠ &nbsp; Игровой стол &nbsp; ♠</span>';document.querySelectorAll('.pair').forEach(e=>e.onclick=()=>{if(selected)act('beat',{card:selected,index:Number(e.dataset.i)})});if(!s.hand.includes(selected))selected=null;$('hand').innerHTML=s.hand.map((c,i)=>`<div data-i="${i}">${card(c,c===selected?'selected':'')}</div>`).join('');$('hand').querySelectorAll('[data-i]').forEach(e=>e.onclick=()=>{selected=s.hand[Number(e.dataset.i)];render()});$('actions').innerHTML='';$('result').textContent=s.result||'';if(s.phase==='end'){$('status').textContent=s.pogony?'★ ПОГОНЫ ★':'Партия завершена';if(s.pogony)$('table').innerHTML=s.pogony.cards.map(c=>card(c)).join('');if(m===0)btn('Следующая партия','start');return}let atk=m%2===s.attack%2,def=m===s.defend;$('status').textContent=def?(s.taking?'Вы берёте карты':'Отбивайтесь: выберите карту и нажмите на атаку'):atk?(s.taking?'Соперник берёт — можно подкинуть или повесить погоны':'Ваша команда атакует'):'Напарник отбивается';if(atk){btn('Подкинуть','attack',!selected);btn('Бито / хватит','pass',!s.table.length);if(s.taking&&!s.deck)btn('Повесить погоны','pogony')}if(def&&!s.taking)btn('Взять','take',!s.table.length)}setInterval(refresh,850);refresh();</script></html>
